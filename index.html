<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Małgorzata Judycka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #fffbf9;
      color: #3c2f2f;
      font-family: "Montserrat", Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* kolorowe, rozmyte plamy w tle – stałe dla całej strony, powoli się przesuwają */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 25%, rgba(0, 184, 255, 0.45), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255, 140, 105, 0.40), transparent 42%),
        radial-gradient(circle at 70% 80%, rgba(124, 92, 255, 0.35), transparent 45%),
        radial-gradient(circle at 25% 85%, rgba(255, 214, 102, 0.35), transparent 40%);
      filter: blur(40px);
      animation: drift 16s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(-3%, 2%) scale(1.05); }
      to   { transform: translate(3%, -2%) scale(1); }
    }

    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    /* ---------- ELEMENTY WSPÓLNE (strona + wizytówka) ---------- */

    /* mała szklana plakietka nad imieniem */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      margin: 0 auto 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #011f4b;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00b8ff;
      box-shadow: 0 0 10px #00b8ff;
    }

    /* imię z przesuwającym się gradientem */
    h1,
    h2 {
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      background: linear-gradient(100deg, #011f4b 0%, #0a4fd1 35%, #00b8ff 60%, #7c5cff 85%, #011f4b 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 { font-size: clamp(2.8rem, 9vw, 6rem); }
    h2 { font-size: clamp(1.8rem, 5.5vw, 2.8rem); }

    .divider {
      display: block;
      width: 90px;
      height: 3px;
      margin: 28px auto;
      border-radius: 3px;
      background: linear-gradient(90deg, #00b8ff, #7c5cff, #ff8c69);
    }

    .roles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    /* szklane plakietki z kolorowymi kropkami */
    .roles span {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px -10px rgba(1, 31, 75, 0.25);
      color: #011f4b;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .roles span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00b8ff;
    }

    .roles span:nth-child(2)::before { background: #ff8c69; }
    .roles span:nth-child(3)::before { background: #7c5cff; }

    .roles span:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -12px rgba(1, 31, 75, 0.35);
    }

    /* ---------- SEKCJA STARTOWA ---------- */
    .hero {
      position: relative;
    }

    .hero .divider {
      margin: 30px auto;
    }

    /* pojawianie się napisów po wejściu na stronę */
    .hero .eyebrow,
    .hero h1,
    .hero .divider,
    .hero .roles {
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }

    .hero h1       { animation: fadeUp 1s ease 0.15s forwards, shine 8s linear 1s infinite; }
    .hero .divider { animation-delay: 0.35s; }
    .hero .roles   { animation-delay: 0.55s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* podpowiedź "przewiń" na dole */
    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(1, 31, 75, 0.6);
    }

    .scroll-hint::after {
      content: "";
      width: 1px;
      height: 40px;
      background: linear-gradient(#00b8ff, transparent);
      animation: drop 1.8s ease-in-out infinite;
    }

    @keyframes drop {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* ---------- WIZYTÓWKA (szklana karta w stylu strony) ---------- */
    .panel {
      position: relative;
      max-width: 640px;
      width: 100%;
      aspect-ratio: 7 / 4;
      padding: 48px 28px;
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* delikatne kolorowe poświaty wewnątrz szklanej karty */
      background:
        radial-gradient(circle at 12% 15%, rgba(0, 184, 255, 0.16), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(255, 140, 105, 0.16), transparent 45%),
        radial-gradient(circle at 88% 10%, rgba(124, 92, 255, 0.14), transparent 40%),
        rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 30px 60px -25px rgba(1, 31, 75, 0.3),
        0 10px 20px -12px rgba(1, 31, 75, 0.2);

      opacity: 0;
      transform: translateX(120%);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
    }

    .panel.visible {
      opacity: 1;
      transform: translateX(0);
    }

    /* narożniki w kształcie litery L */
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border: 0 solid #00b8ff;
    }

    .panel::before {
      top: 26px;
      left: 26px;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    .panel::after {
      bottom: 26px;
      right: 26px;
      border-bottom-width: 2px;
      border-right-width: 2px;
    }

    .panel .eyebrow {
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.75);
    }

    .panel .divider {
      width: 70px;
      margin: 20px auto;
    }

    /* mniejsze plakietki ze stanowiskami, żeby zmieściły się na karcie */
    .panel .roles {
      gap: 8px;
    }

    .panel .roles span {
      padding: 8px 14px;
      gap: 8px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.75);
    }

    .panel .tagline {
      margin-top: 22px;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(1, 31, 75, 0.75);
    }

    footer {
      padding: 24px;
      font-size: 0.85rem;
      color: #666;
    }

    @media (max-width: 520px) {
      .panel {
        padding: 44px 20px;
      }

      .panel::before { top: 18px; left: 18px; width: 22px; height: 22px; }
      .panel::after  { bottom: 18px; right: 18px; width: 22px; height: 22px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div>
      <p class="eyebrow">Portfolio</p>
      <h1>Małgorzata Judycka</h1>
      <span class="divider"></span>
      <div class="roles">
        <span>Software Engineer</span>
        <span>Software Tester</span>
        <span>Automation Tester</span>
      </div>
    </div>
    <a class="scroll-hint" href="#card">Scroll</a>
  </section>

  <section id="card">
    <div class="panel">
      <p class="eyebrow">Business Card</p>
      <h2>Małgorzata Judycka</h2>
      <span class="divider"></span>
      <div class="roles">
        <span>Software Engineer</span>
        <span>Software Tester</span>
        <span>Automation Tester</span>
      </div>
      <p class="tagline">I have experience, just trust me.</p>
    </div>
  </section>

  <footer>© 2026 Małgorzata Judycka</footer>

  <script>
    // Obserwujemy sekcję (która się nie rusza), a nie samą wizytówkę
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const panel = entry.target.querySelector(".panel");
        if (panel) panel.classList.toggle("visible", entry.isIntersecting);
      });
    }, { threshold: 0.3 });

    document.querySelectorAll(".panel").forEach((el) => observer.observe(el.parentElement));
  </script>
</body>
</html>
