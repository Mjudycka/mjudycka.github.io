<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Małgorzata Judycka</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #fffbf9;
      color: #3c2f2f;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      overflow-x: hidden; 
    }
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .roles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .roles span {
      background: 	#fff2eb;
      border: 1px solid #4b3832;
      color: #4b3832;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 1.1rem;
    }

    .panel {
      background: #f7e9e3;
      color: #111;
      max-width: 700px;
      width: 100%;
      padding: 48px 32px;
      border-radius: 16px;
      opacity: 0;
      transform: translateX(120%);
      transition: transform 0.8s ease;
    }

    .panel.visible {
      opacity: 1;
      transform: translateX(0);
      }

    .panel h2 {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .panel p {
      line-height: 1.7;
      font-size: 1.05rem;
    }

    footer {
      padding: 24px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <section>
    <div>
      <h1>Małgorzata Judycka</h1>
      <div class="roles">
        <span>Software Engineer</span>
        <span>Software Tester</span>
        <span>Automation Tester</span>
     </div>
    </div>
  </section>

  <section>
    <div class="panel">
      <h2>Business Card</h2>
      <p>
        I have experience, just trust me.
      </p>
    </div>
  </section>

  <footer>© 2026 Małgorzata Judycka</footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        entry.target.classList.toggle("visible", entry.isIntersecting);
      });
    }, {threshold: 0.3 });

    document.querySelectorAll(".panel").forEach((el) => observer.observe(el));
  </script>
</body>
</html>
